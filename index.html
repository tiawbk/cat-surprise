<html lang="en">
<head>

    <title>Urgent Cat Message! 🐾</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffeef2;
            color: #4a4a4a;
            text-align: center;
        }
        header {
            background: linear-gradient(135deg, #ff9a9e, #fecfef);
            color: #5d4037;
            padding: 40px 20px;
        }
        h1 { margin: 0; font-size: 2.2rem; }
        .container { max-width: 600px; margin: 20px auto; padding: 0 15px; }
        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 8px 16px rgba(255, 154, 158, 0.2);
            position: relative;
        }
        .main-gif {
            width: 100%;
            max-width: 350px;
            border-radius: 15px;
            margin: 15px 0;
        }
        .btn-container {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
            height: 70px;
            position: relative;
        }
        button {
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            height: 50px;
        }
        #yesBtn {
            background-color: #4caf50;
            color: white;
            box-shadow: 0 4px 10px rgba(76, 175, 80, 0.3);
            z-index: 10;
        }
        #noBtn {
            background-color: #f44336;
            color: white;
            position: absolute;
            box-shadow: 0 4px 10px rgba(244, 67, 54, 0.3);
            transition: all 0.1s ease;
            z-index: 20;
        }
        #successMessage {
            display: none;
            margin-top: 20px;
        }
        #successMessage h2 {
            color: #ff477e;
            font-size: 1.6rem;
            margin-bottom: 15px;
        }
        .meme-img {
            width: 100%;
            max-width: 300px;
            border-radius: 15px;
            border: 3px solid #ffb3c1;
        }
    </style>
</head>

    </header>
