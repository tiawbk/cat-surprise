<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urgent Cat Message! 🐾</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffeef2;
            color: #333333;
            text-align: center;
        }
        header {
            background: linear-gradient(135deg, #ff9a9e, #fecfef);
            color: #4a3728;
            padding: 40px 20px;
            border-bottom: 3px solid #ffb3c1;
        }
        h1 { margin: 0; font-size: 2.2rem; font-weight: bold; }
        .container { max-width: 600px; margin: 30px auto; padding: 0 15px; }
        .card {
            background-color: #ffffff !important;
            border: 3px solid #ffb3c1;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 8px 24px rgba(255, 154, 158, 0.3);
            position: relative;
            min-height: 400px;
        }
        .main-gif {
            width: 100%;
            max-width: 320px;
            border-radius: 15px;
            margin: 15px auto;
            display: block;
            height: 220px;
            object-fit: cover;
        }
        .question-text {
            font-size: 1.4rem; 
            font-weight: bold; 
            color: #222222;
            margin: 20px 0;
        }
        .btn-container {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
            height: 100px;
            position: relative;
        }
        button {
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            height: 55px;
        }
        #yesBtn {
            background-color: #2ecc71;
            color: white;
            box-shadow: 0 4px 10px rgba(46, 204, 113, 0.4);
            z-index: 10;
        }
        #noBtn {
            background-color: #e74c3c;
            color: white;
            position: absolute;
            box-shadow: 0 4px 10px rgba(231, 76, 60, 0.4);
            transition: all 0.15s ease;
            z-index: 20;
        }
        #successMessage {
            display: none;
            margin-top: 20px;
        }
        #successMessage h2 {
            color: #ff477e;
            font-size: 1.8rem;
            margin-bottom: 15px;
        }
        .meme-img {
            width: 100%;
            max-width: 300px;
            border-radius: 15px;
            border: 4px solid #ffb3c1;
            display: block;
            margin: 0 auto;
            height: 220px;
            object-fit: cover;
        }
    </style>
</head>

    </header>
