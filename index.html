<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Urgent Cat Message! 🐾</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #ffeef2;
            color: #333333;
            text-align: center;
        }
        header {
            background: linear-gradient(135deg, #ff9a9e, #fecfef);
            color: #4a3728;
            padding: 40px 20px;
            border-bottom: 3px solid #ffb3c1;
        }
        h1 { margin: 0; font-size: 2.2rem; font-weight: bold; }
        .container { max-width: 600px; margin: 30px auto; padding: 0 15px; }
        .card {
            background-color: #ffffff !important;
            border: 3px solid #ffb3c1;
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
            box-shadow: 0 8px 24px rgba(255, 154, 158, 0.3);
            position: relative;
            min-height: 400px;
        }
        .main-gif {
            width: 100%;
            max-width: 320px;
            border-radius: 15px;
            margin: 15px auto;
            display: block;
        }
        .question-text {
            font-size: 1.4rem; 
            font-weight: bold; 
            color: #222222;
            margin: 20px 0;
        }
        .btn-container {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 20px;
            height: 100px;
            position: relative;
        }
        button {
            padding: 12px 30px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            height: 55px;
        }
        #yesBtn {
            background-color: #2ecc71;
            color: white;
            box-shadow: 0 4px 10px rgba(46, 204, 113, 0.4);
            z-index: 10;
        }
        #noBtn {
            background-color: #e74c3c;
            color: white;
            position: absolute;
            box-shadow: 0 4px 10px rgba(231, 76, 60, 0.4);
            transition: all 0.15s ease;
            z-index: 20;
        }
        #successMessage {
            display: none;
            margin-top: 20px;
        }
        #successMessage h2 {
            color: #ff477e;
            font-size: 1.8rem;
            margin-bottom: 15px;
        }
        .meme-img {
            width: 100%;
            max-width: 300px;
            border-radius: 15px;
            border: 4px solid #ffb3c1;
            display: block;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <header>
        <h1>Meow! Message for My Favorite Human 🐾</h1>
        <p style="font-size: 1.1rem; font-weight: 500;">This page will self-destruct if you don't answer honestly.</p>
    </header>

    <div class="container">

        <!-- Question Card -->
        <div class="card" id="mainCard">
            <img class="main-gif" src="https://giphy.com" alt="Cat typing fast">
            
            <p class="question-text">
                Will you be my partner in crime for an epic road trip adventure?
            </p>
            
            <div class="btn-container">
                <button id="yesBtn" onclick="saidYes()">Heck Yes! 😼</button>
                <button id="noBtn" onmouseover="dodgeNo()" style="left: 55%; top: 0px;">No 😿</button>
            </div>

            <!-- Secret Success Content -->
            <div id="successMessage">
                <h2>🎉 EXCELLENT. Packing the catnip right now! 🚗💨</h2>
                <img class="meme-img" src="https://giphy.com" alt="Cat driving a car">
            </div>
        </div>

    </div>

    <script>
        function saidYes() {
            document.getElementById("successMessage").style.display = "block";
            document.getElementById("yesBtn").style.display = "none";
            document.getElementById("noBtn").style.display = "none";
            document.querySelector(".main-gif").style.display = "none";
            document.querySelector(".question-text").style.display = "none";
        }

        function dodgeNo() {
            var noBtn = document.getElementById("noBtn");
            var card = document.getElementById("mainCard");
            
            // Stay within safe boundaries of the card
            var maxWidth = card.clientWidth - noBtn.clientWidth - 40;
            var maxHeight = card.clientHeight - noBtn.clientHeight - 160;
            
            var randomX = Math.floor(Math.random() * maxWidth);
            var randomY = Math.floor(Math.random() * maxHeight) + 80;
            
            noBtn.style.left = randomX + "px";
            noBtn.style.top = randomY + "px";
        }
    </script>

</body>
</html>
